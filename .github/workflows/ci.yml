name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      # 浏览器实机验收（scripts/verify-ui.cjs）依赖 Microsoft Edge 与本地开发服务器，
      # 在 GitHub Actions 的 ubuntu runner 上不运行；请在本地按 README 执行：
      #   pnpm dev
      #   node scripts/verify-ui.cjs
